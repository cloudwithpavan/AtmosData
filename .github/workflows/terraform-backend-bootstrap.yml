
name: AtmosData - Terraform Backend Bootstrap

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  bootstrap:
    name: Create Terraform State Bucket
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SERVICE_ACCOUNT }}
          create_credentials_file: true

      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Initialize
        run: terraform -chdir=terraform/backend-bootstrap init -input=false

      - name: Terraform Validate
        run: terraform -chdir=terraform/backend-bootstrap validate

      - name: Terraform Plan
        run: terraform -chdir=terraform/backend-bootstrap plan -input=false

      - name: Terraform Apply
        run: terraform -chdir=terraform/backend-bootstrap apply -input=false -auto-approve
