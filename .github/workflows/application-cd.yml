
name: Application CD

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  GCP_PROJECT_ID: my-project-77-511616
  GCP_REGION: asia-south1
  COMPOSER_ENVIRONMENT_NAME: atmosdata-composer-dev

  RUNTIME_SERVICE_ACCOUNT: atmosdata-functions@my-project-77-511616.iam.gserviceaccount.com
  EVENTARC_TRIGGER_SERVICE_ACCOUNT: atmosdata-eventarc-trigger@my-project-77-511616.iam.gserviceaccount.com

  RAW_BUCKET_NAME: weatherpulse-raw-dev-802327721598
  OPENWEATHER_SECRET_NAME: openweather-api-key
  BRONZE_DATASET: weather_bronze_dev
  BRONZE_TABLE: weather_observations

  SQL_INSTANCE_CONNECTION_NAME: my-project-77-511616:asia-south1:atmosdata-mysql-dev
  MYSQL_DATABASE: atmosdata_ops
  MYSQL_USER: atmosdata_app
  MYSQL_PASSWORD_SECRET_NAME: atmosdata-mysql-password

  GMAIL_SENDER: pavan7071@gmail.com
  GMAIL_RECIPIENTS: "pavankumargummadi77@gmail.com;jeevanmarygummadi@gmail.com"
  GMAIL_SECRET_NAME: gmail-app-password

jobs:
  deploy-weather-ingestion:
    name: Deploy Weather Ingestion Function
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Deploy Weather Ingestion Function
        run: |
          gcloud functions deploy weather-ingestion \
            --gen2 \
            --project="$GCP_PROJECT_ID" \
            --region="$GCP_REGION" \
            --runtime=python311 \
            --source=cloud_run_functions/weather_ingestion \
            --entry-point=ingest_weather \
            --trigger-http \
            --no-allow-unauthenticated \
            --service-account="$RUNTIME_SERVICE_ACCOUNT" \
            --set-env-vars="GCP_PROJECT_ID=$GCP_PROJECT_ID,RAW_BUCKET_NAME=$RAW_BUCKET_NAME,OPENWEATHER_SECRET_NAME=$OPENWEATHER_SECRET_NAME,SQL_INSTANCE_CONNECTION_NAME=$SQL_INSTANCE_CONNECTION_NAME,MYSQL_DATABASE=$MYSQL_DATABASE,MYSQL_USER=$MYSQL_USER,MYSQL_PASSWORD_SECRET_NAME=$MYSQL_PASSWORD_SECRET_NAME,GMAIL_SENDER=$GMAIL_SENDER,GMAIL_RECIPIENTS=$GMAIL_RECIPIENTS,GMAIL_SECRET_NAME=$GMAIL_SECRET_NAME" \
            --memory=256MiB \
            --timeout=120s \
            --max-instances=3 \
            --quiet

      - name: Verify Weather Ingestion
        run: |
          gcloud functions describe weather-ingestion \
            --gen2 \
            --project="$GCP_PROJECT_ID" \
            --region="$GCP_REGION" \
            --format="yaml(name,state,serviceConfig.uri)"

      - name: Deploy GCS to BigQuery Loader with Eventarc
        run: |
          gcloud functions deploy weather-gcs-to-bq \
            --gen2 \
            --project="$GCP_PROJECT_ID" \
            --region="$GCP_REGION" \
            --runtime=python311 \
            --source=cloud_run_functions/gcs_to_bigquery \
            --entry-point=load_gcs_to_bigquery \
            --trigger-location="$GCP_REGION" \
            --trigger-service-account="$EVENTARC_TRIGGER_SERVICE_ACCOUNT" \
            --trigger-event-filters="type=google.cloud.storage.object.v1.finalized" \
            --trigger-event-filters="bucket=$RAW_BUCKET_NAME" \
            --service-account="$RUNTIME_SERVICE_ACCOUNT" \
            --set-env-vars="GCP_PROJECT_ID=$GCP_PROJECT_ID,RAW_BUCKET_NAME=$RAW_BUCKET_NAME,BRONZE_DATASET=$BRONZE_DATASET,BRONZE_TABLE=$BRONZE_TABLE" \
            --memory=256MiB \
            --timeout=120s \
            --max-instances=3 \
            --quiet

      - name: Grant Eventarc permission to invoke loader
        run: |
          gcloud run services add-iam-policy-binding weather-gcs-to-bq \
            --project="$GCP_PROJECT_ID" \
            --region="$GCP_REGION" \
            --member="serviceAccount:$EVENTARC_TRIGGER_SERVICE_ACCOUNT" \
            --role="roles/run.invoker"

      - name: Verify GCS to BigQuery Loader and Eventarc
        run: |
          gcloud functions describe weather-gcs-to-bq \
            --gen2 \
            --project="$GCP_PROJECT_ID" \
            --region="$GCP_REGION" \
            --format="yaml(name,state,eventTrigger,serviceConfig.uri,serviceConfig.serviceAccountEmail)"

      - name: Deploy Airflow DAGs and SQL to Cloud Composer
        run: |
          DAG_GCS_PREFIX=$(gcloud composer environments describe "$COMPOSER_ENVIRONMENT_NAME" \
            --location="$GCP_REGION" \
            --project="$GCP_PROJECT_ID" \
            --format="value(config.dagGcsPrefix)")

          if [ -z "$DAG_GCS_PREFIX" ]; then
            echo "ERROR: Could not determine Composer DAG bucket."
            exit 1
          fi

          echo "Uploading Airflow DAGs to: $DAG_GCS_PREFIX"

          gcloud storage rsync \
            --recursive \
            airflow/dags \
            "$DAG_GCS_PREFIX"

          echo "Airflow DAG and SQL upload completed."
